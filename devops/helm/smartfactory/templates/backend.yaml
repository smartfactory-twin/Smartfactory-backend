{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-backend-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - python
            - manage.py
            - migrate
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: {{ .Values.secret.existingName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - daphne
            - -b
            - 0.0.0.0
            - -p
            - "8000"
            - core.asgi:application
          ports:
            - name: {{ .Values.backend.service.portName }}
              containerPort: {{ .Values.backend.service.port }}
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: {{ .Values.secret.existingName }}
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: ml-artifacts
              mountPath: /app/ml/artifacts
          startupProbe:
            tcpSocket:
              port: {{ .Values.backend.service.portName }}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.portName }}
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.portName }}
            periodSeconds: 10
          resources:
{{ toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.media.claimName }}
        - name: ml-artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.mlArtifacts.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: {{ .Values.backend.service.portName }}
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.portName }}